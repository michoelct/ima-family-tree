<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#5b283c">
  <title>Ima's Family Tree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">🌳</div>
      <div class="brand-text">
        <h1 id="appTitle">Ima's Family Tree</h1>
        <p id="appSub">Loading the family…</p>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button data-view="tree" class="on">Tree</button>
      <button data-view="people">Everyone</button>
      <button data-view="me">Me</button>
    </nav>
    <button id="meChip" class="me-chip" hidden></button>
  </header>

  <main>
    <!-- TREE -->
    <section id="view-tree" class="view on">
      <div class="tree-bar">
        <input id="treeFind" type="search" placeholder="Find someone in the tree" autocomplete="off" aria-label="Find someone in the tree">
        <div id="treeFindList" class="find-list" hidden></div>
      </div>
      <div id="pathBar" class="path-bar" hidden>
        <div class="path-text"><strong id="pathTitle"></strong><span id="pathSub"></span></div>
        <button id="pathClear" aria-label="Clear highlighted line">✕</button>
      </div>
      <div class="vp-wrap">
      <div id="viewport" class="viewport" tabindex="0" aria-label="Family tree — drag to move, pinch or scroll to zoom">
        <div id="stage" class="stage">
          <svg id="lines" class="lines"></svg>
          <div id="cards"></div>
        </div>
      </div>
          <div class="zoom">
          <button id="zoomOut" aria-label="Zoom out">−</button>
          <button id="zoomFit">Fit</button>
          <button id="zoomIn" aria-label="Zoom in">+</button>
          <button id="zoomMe" hidden>Me</button>
        </div>
      </div>
      <p class="hint" id="treeHint">Tap a person to see who they are and how you're related. Drag to move, pinch to zoom.</p>
    </section>

    <!-- EVERYONE -->
    <section id="view-people" class="view">
      <div class="pad">
        <input id="peopleFind" type="search" placeholder="Search by name or nickname" autocomplete="off" aria-label="Search everyone">
        <div id="peopleList"></div>
      </div>
    </section>

    <!-- ME -->
    <section id="view-me" class="view">
      <div class="pad" id="meBody"></div>
    </section>

    <!-- ORGANISER -->
    <section id="view-organizer" class="view">
      <div class="pad" id="orgBody"></div>
    </section>
  </main>

  <nav class="bottom" aria-label="Sections">
    <button data-view="tree" class="on"><span>🌳</span>Tree</button>
    <button data-view="people"><span>👥</span>Everyone</button>
    <button data-view="me"><span>🙂</span>Me</button>
  </nav>

  <!-- person panel -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetName">
    <button class="sheet-close" id="sheetClose" aria-label="Close">✕</button>
    <div id="sheetBody"></div>
  </aside>

  <!-- welcome after scanning a badge -->
  <div id="welcome" class="modal" hidden role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-ribbon"></div>
      <p class="eyebrow" id="welcomeEyebrow">Welcome!</p>
      <h2>Are you <span id="welcomeName"></span>?</h2>
      <p id="welcomeFull" class="muted"></p>
      <button class="btn primary" id="welcomeYes">Yes, that's me</button>
      <button class="btn" id="welcomeNo">No, just looking</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="printRoot" class="print-root"></div>

  <script src="js/config.js"></script>
  <script src="js/vendor/qrcode.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/relations.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
